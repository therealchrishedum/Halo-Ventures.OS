<!doctype html>
<html lang="en" data-era="before">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halo Before After</title>
<meta name="description" content="From founder-led to system-driven. Four gaps, and the fix for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--fg:#fff;--g1:#0a0a0b;--g2:#111113;--g3:#1e1e21;--g4:#34343a;--g5:#55555c;
  --mute:#8c8c93;--soft:#c9c9ce;--acc:#E83214;
  --hd:56px;--ruler:56px;--hud:32px;--gut:16px;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.7,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff}
*{box-sizing:border-box}
html{background:var(--bg);overflow-x:clip;-webkit-text-size-adjust:100%;scroll-padding-top:var(--hd)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
i.sl{font-style:normal;color:var(--mute)}
h1,h2,.num,.cl1{text-wrap:balance}
p{text-wrap:pretty}

/* edge cash layer */
#edge{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
main,footer{position:relative;z-index:2}

/* header */
.hd{position:fixed;top:0;left:0;right:0;height:var(--hd);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 var(--gut);background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--g3)}
.wm{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-decoration:none;white-space:nowrap;font-weight:500}
.era{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 8px;flex:none;border:1px solid var(--g4);border-radius:999px;transition:border-color .5s var(--ease)}
.era:hover{border-color:var(--g5)}
.era-l{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--mute);transition:color .4s}
.era-l.b{display:none}.era-l.a{display:none}
[data-era=before] .era-l.b,[data-era=after] .era-l.a{display:inline;color:var(--fg)}
.ec{width:26px;height:26px;flex:none;display:block;overflow:visible;order:-1}
.ec .moon{transition:transform .9s var(--ease)}
.ec .cor{transition:opacity .6s .3s}
[data-era=before] .ec .moon{transform:translateX(7px)}
[data-era=before] .ec .cor{opacity:0}
[data-era=after] .ec .moon{transform:none}
[data-era=after] .ec .cor{opacity:1}
[data-era=after] .era{border-color:var(--soft)}
.cta{height:44px;padding:0 16px;flex:none;border-radius:999px;background:var(--fg);color:#000;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;text-decoration:none}
.cta:hover{background:var(--soft)}
@media (min-width:760px){
  :root{--gut:32px}
  .wm{font-size:12px;letter-spacing:.16em}
  .era-l{font-size:11px;letter-spacing:.1em}
  .era{padding:0 16px;gap:16px}
  .era-l.b,.era-l.a{display:inline}
  .era-l.b{order:0}.ec{order:1}.era-l.a{order:2}
  .hd{display:grid;grid-template-columns:1fr auto 1fr}
  .hd .cta{justify-self:end}
}

/* hero */
.hero{min-height:100svh;padding:calc(var(--hd) + 32px) var(--gut) 40px;display:grid;grid-template-rows:auto 1fr auto;gap:24px;max-width:1440px;margin:0 auto}
.hero-ec{display:flex;justify-content:center;align-items:center}
.hero-ec svg{width:min(78vw,340px);height:auto;overflow:visible}
.big .moon{transition:transform 1.4s var(--ease)}
.big .cor{transition:opacity .9s .5s}
[data-era=before] .hero .big .moon{transform:translateX(64px)}
[data-era=before] .hero .big .cor{opacity:0}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,11vw,96px);line-height:1;letter-spacing:-.01em;margin:0;max-width:12ch}
.hero .sub{margin:16px 0 0;color:var(--soft);font-size:18px;max-width:34ch}
.hero .hint{margin-top:24px;display:flex;gap:8px;align-items:center;color:var(--mute)}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.ghost{height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--g4);font-size:14px;display:inline-flex;align-items:center;gap:8px}
.ghost:hover{border-color:var(--soft)}
@media (min-width:900px){
  .hero{grid-template-columns:1.1fr 1fr;grid-template-rows:1fr;align-items:center;padding-left:56px;padding-right:56px}
  .hero-ec{order:2}
  .hero-ec svg{width:min(40vw,520px)}
}

/* reel */
.reel{position:relative}
.stage{position:sticky;top:0;height:100svh;padding-top:var(--hd);display:flex;flex-direction:column;overflow:hidden}
.hud{height:var(--hud);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--gut);color:var(--mute);border-bottom:1px solid var(--g2)}
.hud .k b{font-weight:500;color:var(--fg)}
.scenes{position:relative;flex:1;min-height:0}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
.scene.on{opacity:1;visibility:visible;transition:opacity .5s var(--ease),visibility 0s}
.pane{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:16px var(--gut) 8px;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .55s var(--ease),transform .7s var(--ease),visibility 0s .55s}
.pane.cur{opacity:1;visibility:visible;transform:none;transition:opacity .55s var(--ease) .08s,transform .7s var(--ease) .08s,visibility 0s}
.scene:not(.on) .pane,.scene:not(.on) .pane.cur{visibility:hidden;pointer-events:none;transition:opacity .5s var(--ease),visibility 0s .5s}
.kick{display:flex;gap:8px;align-items:center;color:var(--mute);margin-bottom:8px}
.kick .dot{width:8px;height:8px;border-radius:50%;background:var(--g5);flex:none}
.pane.a .kick .dot{background:var(--acc)}
.num{font-family:var(--serif);font-weight:400;font-size:clamp(36px,10vw,96px);line-height:1;letter-spacing:-.015em;margin:0;max-width:14ch}
.line{font-size:18px;line-height:1.35;margin:16px 0 0;max-width:30ch;color:var(--soft)}
.src{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--mute);margin:8px 0 0;line-height:1.5;max-width:60ch}
.nw{white-space:nowrap}
.ln{display:block}
.viz{display:flex;flex-direction:column;min-height:0;gap:8px}
.vbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.vbox svg{width:100%;height:100%;max-height:400px;display:block;overflow:visible}
.vfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--g4);font-size:13px;color:var(--soft);transition:border-color .3s,color .3s,background .3s}
.chip[aria-pressed=true]{border-color:var(--fg);color:var(--fg);background:var(--g2)}
.out{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.out b{color:var(--fg);font-weight:500}
.hintx{display:inline-flex;align-items:center;gap:8px;color:var(--mute)}
.hintx:before{content:"";width:14px;height:14px;border:1px solid var(--g5);border-radius:50%;box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 8px var(--g5)}
svg text{font-family:var(--mono);font-size:10px;letter-spacing:.06em;fill:var(--mute);text-transform:uppercase}
svg .hit{fill:transparent;cursor:pointer}
svg [tabindex]:focus{outline:none}
.kb svg [tabindex]:focus{outline:2px solid #fff;outline-offset:2px}
svg .drag{touch-action:none;cursor:grab}

/* crossing */
.cross .pane{grid-template-rows:auto 1fr auto;justify-items:center;text-align:center;padding-top:16px}
.cross .xlab{font-family:var(--serif);font-size:clamp(44px,13vw,120px);line-height:1;position:relative;height:1.05em;width:100%}
.cross .xlab span{position:absolute;left:0;right:0;transition:opacity .6s var(--ease),transform .8s var(--ease)}
.cross .xlab .xa{opacity:0;transform:translateY(12px)}
.cross.flip .xlab .xb{opacity:0;transform:translateY(-12px)}
.cross.flip .xlab .xa{opacity:1;transform:none}
.cross .xsvg{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.cross .xsvg svg{height:100%;max-height:440px;width:auto;max-width:100%;overflow:visible}
.cross .xline{font-size:18px;color:var(--soft);margin:0 0 8px;min-height:1.4em;transition:opacity .6s}
.cross:not(.flip) .xline{opacity:0}

/* ruler */
.ruler{height:var(--ruler);display:flex;align-items:center;gap:0;padding:0 8px;border-top:1px solid var(--g2)}
.ruler .side{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;padding:0 8px;display:none}
.ticks{flex:1;display:flex;align-items:center;justify-content:space-between;position:relative;height:100%}
.ticks:before{content:"";position:absolute;left:22px;right:22px;top:50%;height:1px;background:var(--g3)}
.ticks .fill{position:absolute;left:22px;top:50%;height:1px;background:var(--soft);width:0;transform-origin:left}
.tk{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.tk i{display:block;width:1px;height:10px;background:var(--g5);transition:height .3s,background .3s,width .3s}
.tk.past i{background:var(--soft)}
.tk.cur i{height:20px;width:2px;background:var(--fg)}
.tk.mid{width:18px}
.tk.mid svg{width:18px;height:18px;overflow:visible}
.tk.mid.cur svg .cor{opacity:1}
@media (min-width:760px){.ruler .side{display:block}}

@media (min-width:900px){
  :root{--hud:40px}
  .pane{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:1fr;gap:48px;align-items:center;padding:24px 56px}
  .num{font-size:clamp(48px,5vw,80px);max-width:16ch}
  .line{font-size:22px}
  .viz{height:100%;max-height:640px;justify-content:center}
  .vbox svg{max-height:480px}
  .cross .pane{grid-template-columns:1fr}
}
@media (max-height:700px) and (max-width:899px){
  .num{font-size:32px}.line{font-size:16px;margin-top:8px}.src{margin-top:4px}
}

/* close */
.after{border-top:1px solid var(--g3);background:#000}
.sec{max-width:1240px;margin:0 auto;padding:96px var(--gut)}
.close{min-height:80svh;display:flex;flex-direction:column;justify-content:center}
.cl1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,9.6vw,96px);line-height:1.02;letter-spacing:-.01em;margin:0;color:var(--mute)}
.cl1 span{display:block}
.cl1 em{color:#fff;font-style:italic;display:block}
.cl2{font-size:18px;line-height:1.4;color:#fff;margin:48px 0 16px}
.pill{display:inline-grid;grid-template-columns:auto 18px;align-items:center;gap:12px;min-height:56px;padding:0 24px;border-radius:999px;background:var(--acc);color:#000;font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:.01em;border:0;cursor:pointer;max-width:100%;justify-self:start;align-self:flex-start}
.pill .pt{display:grid}
.pill .pt>span{grid-area:1/1;transition:opacity .2s;white-space:nowrap}
.pill .pt .b{opacity:0}
.pill.done .pt .a{opacity:0}
.pill.done .pt .b{opacity:1}
.pill svg{width:18px;height:18px;display:block}
.pill:focus-visible{outline:2px solid #fff;outline-offset:4px}
footer{border-top:1px solid var(--g3)}
footer .sec{padding-top:32px;padding-bottom:48px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center}
footer .mono{color:var(--mute)}
@media (min-width:760px){.sec{padding:128px 56px}footer .sec{padding-top:32px;padding-bottom:48px}}
@media (max-width:370px){.pill{padding:0 16px;font-size:14px;gap:8px}}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<canvas id="edge" aria-hidden="true"></canvas>

<header class="hd">
  <a class="wm" href="#top" aria-label="HALO // VENTURES, back to top">HALO <i class="sl">//</i> VENTURES</a>
  <button class="era" id="era" role="switch" aria-checked="false" aria-label="Before Halo or After Halo">
    <span class="era-l b">Before Halo</span>
    <svg class="ec" viewBox="-15 -15 30 30" aria-hidden="true"><circle r="13" fill="url(#gl)" opacity=".55"/><circle class="cor" r="11.6" fill="none" stroke="#fff" stroke-width="1.6"/><circle r="9.4" fill="none" stroke="#fff" stroke-width="1.3"/><circle class="moon" r="9" fill="#000"/></svg>
    <span class="era-l a">After Halo</span>
  </button>
  <a class="cta" href="#contact">Contact</a>
</header>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="gl"><stop offset=".55" stop-color="#fff" stop-opacity=".9"/><stop offset=".72" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glb"><stop offset=".5" stop-color="#fff" stop-opacity=".0"/><stop offset=".6" stop-color="#fff" stop-opacity=".55"/><stop offset=".68" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glo"><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset=".64" stop-color="#fff" stop-opacity=".35"/><stop offset=".74" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs></svg>
<div class="sr" aria-live="polite" id="live"></div>

<main id="top">
  <section class="hero" aria-label="Introduction">
    <div class="hero-ec" aria-hidden="true">
      <svg class="big" viewBox="-200 -200 400 400">
        <circle r="196" fill="url(#glb)"/>
        <circle class="cor" r="196" fill="url(#glo)"/>
        <circle r="120" fill="none" stroke="#fff" stroke-width="1.5"/>
        <circle class="cor" r="128" fill="none" stroke="#fff" stroke-width="2"/>
        <circle class="moon" r="118" fill="#000"/>
      </svg>
    </div>
    <div>
      <h1>From founder‑led to system‑driven.</h1>
      <p class="sub">Four gaps. Four fixes.</p>
      <div class="row">
        <button class="ghost" id="heroFlip"><svg class="ec" viewBox="-15 -15 30 30" aria-hidden="true"><circle r="13" fill="url(#gl)" opacity=".55"/><circle class="cor" r="11.6" fill="none" stroke="#fff" stroke-width="1.6"/><circle r="9.4" fill="none" stroke="#fff" stroke-width="1.3"/><circle class="moon" r="9" fill="#000"/></svg><span>Flip to <span id="heroFlipL">After Halo</span></span></button>
      </div>
      <p class="hint mono">Scroll for the first gap</p>
    </div>
  </section>

  <section class="reel" id="reel" aria-label="Each gap and its fix">
    <div class="stage" id="stage">
      <div class="hud mono"><span class="k" id="hudK"><b>The gap</b></span><span id="hudN">01 / 04</span></div>
      <div class="scenes" id="scenes"></div>
      <nav class="ruler" aria-label="Gaps and fixes">
        <span class="side">Before</span>
        <div class="ticks" id="ticks"><span class="fill" id="tfill"></span></div>
        <span class="side">After</span>
      </nav>
    </div>
  </section>

  <div class="after" id="after">
    <section class="sec close" id="contact" aria-label="Contact">
      <p class="cl1"><span>Change is inevitable.</span> <em>Growth is optional.</em></p>
      <p class="cl2">Ready to grow?</p>
      <button class="pill" id="pill" type="button" aria-label="Copy email address chris@halovpartners.com"><span class="pt"><span class="a">chris@halovpartners.com</span><span class="b" aria-hidden="true">Copied ✓</span></span><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="6" width="9" height="9" rx="1.5"/><path d="M12 3.5V3a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h.5"/></svg></button>
    </section>

    <footer>
      <div class="sec">
        <span class="wm">HALO <i class="sl">//</i> VENTURES</span>
        <span class="mono">Portland, Oregon</span>
      </div>
    </footer>
  </div>
</main>

<script>

var V={};
/* before 1 + 3: 100 failed startups, n lit */

  var svg=S('svg',{viewBox:'0 0 300 300',role:'img','aria-label':o.tgt+' of 100 failed VC-backed startups'},box),R=[],u=null;
  for(var i=0;i<100;i++){var r=9-Math.floor(i/10),c=i%10;R.push(S('rect',{x:c*30+3,y:r*30+3,width:24,height:24,fill:'none',stroke:'#34343a','stroke-width':1},svg))}
